<nav class="pa-navbar">
  <div class="pa-container">
    <div class="inner">
      <a href="{{ url_for('main.index') }}" class="pa-brand">
        <img
          style="width: 55px; height: 55px"
          src="/static/resources/PriceAlert_Icon.png"
          alt="PriceAlert-Icon"
        />
        Price<span>Alert</span>
      </a>

      <button class="pa-menu-toggle" id="pa-menu-toggle" aria-label="Abrir menu">☰</button>
      <div class="pa-nav-links" id="pa-nav-links">
        <a
          href="{{ url_for('main.index') }}"
          class="pa-nav-link {% if request.endpoint == 'main.index' %}active{% endif %}"
        >
          Início
        </a>
        <a
          href="{{ url_for('main.dashboard') }}"
          class="pa-nav-link {% if request.endpoint == 'main.dashboard' %}active{% endif %}"
        >
          Dashboard
        </a>
        <a
          href="{{ url_for('main.search') }}"
          class="pa-nav-link {% if request.endpoint == 'main.search' %}active{% endif %}"
        >
          Buscar
        </a>
        <a
          href="{{ url_for('main.monitored') }}"
          class="pa-nav-link {% if request.endpoint == 'main.monitored' %}active{% endif %}"
        >
          Meus Alertas
        </a>
      </div>

      <div class="pa-nav-actions">
        <!-- Theme Toggle -->
        <div class="theme-toggle-wrap" title="Alternar tema claro/escuro">
          <span id="theme-icon">🌙</span>
          <button class="theme-toggle" id="theme-toggle-btn" aria-label="Alternar tema"></button>
        </div>

        {% if usuario_logado %}
        <form action="{{ url_for('main.logout') }}" method="GET" style="display: inline">
          <button type="submit" class="btn btn-ghost btn-sm">Sair</button>
        </form>
        {% else %}
        <a href="{{ url_for('main.login') }}" class="btn btn-ghost btn-sm">Entrar</a>
        <a href="{{ url_for('main.signup') }}" class="btn btn-primary btn-sm">Cadastrar</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

<script>
  (function () {
    const html = document.documentElement;
    const themeBtn = document.getElementById("theme-toggle-btn");
    const themeIcon = document.getElementById("theme-icon");
    const menuToggleBtn = document.getElementById("pa-menu-toggle");
    const navLinks = document.getElementById("pa-nav-links");

    function applyTheme(theme) {
      if (theme === "light") {
        html.setAttribute("data-theme", "light");
        if (themeIcon) themeIcon.textContent = "☀️";
      } else {
        html.removeAttribute("data-theme");
        if (themeIcon) themeIcon.textContent = "🌙";
      }
    }

    // Apply saved theme immediately (avoids flash)
    const savedTheme = localStorage.getItem("pa-theme") || "dark";
    applyTheme(savedTheme);

    if (themeBtn) {
      themeBtn.addEventListener("click", function () {
        const current = html.getAttribute("data-theme") === "light" ? "light" : "dark";
        const next = current === "dark" ? "light" : "dark";
        localStorage.setItem("pa-theme", next);
        applyTheme(next);
      });
    }

    if (menuToggleBtn) {
      menuToggleBtn.addEventListener("click", function () {
        if (navLinks) {
          navLinks.classList.toggle("is-active");
        }
      });
    }
  })();
</script>
